name: Bug report
description: Report a Discut bug
body:
  - type: markdown
    attributes:
      value: "Use synthetic or redacted evidence. Never attach credentials, private chats or signed URLs. Report vulnerabilities privately as described in SECURITY.md."
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Discut commit/version, OS/version, live account or offline fixture"
    validations:
      required: true
