name: Crash or performance report
description: Report a crash or resource regression
body:
  - type: markdown
    attributes:
      value: "Use synthetic or redacted evidence. Never attach credentials, private chats or signed URLs. Report vulnerabilities privately as described in SECURITY.md."
  - type: textarea
    id: steps
    attributes:
      label: "Workload and reproduction steps"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Discut commit/version, OS, hardware and build type"
    validations:
      required: true
  - type: textarea
    id: measurement
    attributes:
      label: "Observed versus expected results; memory metric, process set, warmup and duration"
    validations:
      required: true
