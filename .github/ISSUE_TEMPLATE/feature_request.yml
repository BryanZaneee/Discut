name: Feature request
description: Propose a focused improvement
body:
  - type: markdown
    attributes:
      value: "Use synthetic or redacted evidence. Never attach credentials, private chats or signed URLs. Report vulnerabilities privately as described in SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: "What problem should this solve?"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Smallest useful solution and alternatives"
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: "Resource cost, default behavior and how users would find it"
    validations:
      required: true
