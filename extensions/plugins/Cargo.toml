# Published catalog plugins. They share the one SDK with the authoring examples.
[workspace]
members = ["message-delete-protector", "emoji-sticker-images", "custom-rpc", "api-proxy"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serein-extension-sdk = { path = "../../examples/extensions/sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
